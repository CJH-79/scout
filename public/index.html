<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scout · 仓库接手简报</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="wrap">

  <header class="head">
    <h1>Scout</h1>
    <p>读取 GitHub 仓库的目录结构与依赖清单，生成一份接手简报。</p>
  </header>

  <section class="panel">
    <form id="repoForm" autocomplete="off">
      <label for="repoUrl">仓库地址</label>
      <div class="row">
        <input id="repoUrl" type="text" placeholder="owner/repo 或完整链接"
               value="spring-projects/spring-petclinic">
        <button type="submit" id="runBtn">分析</button>
      </div>
      <p class="hint">示例
        <button type="button" class="textlink" data-repo="spring-projects/spring-petclinic">spring-petclinic</button>
        <button type="button" class="textlink" data-repo="vuejs/pinia">pinia</button>
        <button type="button" class="textlink" data-repo="expressjs/express">express</button>
      </p>
    </form>
  </section>

  <section id="logSection" class="panel hidden">
    <h2>运行日志</h2>
    <div id="log" class="log"></div>
    <p id="status" class="status"></p>
  </section>

  <section id="result" class="panel hidden">
    <div class="result-head">
      <h2 id="repoName">—</h2>
      <button id="copyBtn" class="textlink">复制 Markdown</button>
    </div>
    <p id="repoDesc" class="desc"></p>

    <table class="tbl" id="metaTable"></table>

    <h3>技术栈</h3>
    <table class="tbl" id="stackTable"></table>

    <h3>代码地图</h3>
    <table class="tbl" id="moduleTable"></table>

    <h3>建议先读</h3>
    <ol id="readList" class="reads"></ol>

    <h3>可以接手的第一个任务</h3>
    <div id="taskBox" class="task"></div>

    <h3>待确认</h3>
    <ul id="questionList" class="questions"></ul>

    <p class="note">数据来源：GitHub 公开仓库的源码包（目录树、依赖清单、文件分布），无预置内容。</p>
  </section>

</main>
<script src="/app.js"></script>
</body>
</html>
